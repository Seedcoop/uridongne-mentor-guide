name: Deploy mentor guide to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - public/**
      - tests/static-check.cjs
      - tests/student-gateway.cjs
      - tests/prompt-safety.cjs
      - supabase/functions/student-portal/**
      - supabase/migrations/202610160002_students.sql
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check public files
        run: node tests/static-check.cjs
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check student gateway
        run: node tests/student-gateway.cjs
      - name: Check prompt safety
        run: node tests/prompt-safety.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload public site
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
          include-hidden-files: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
